profile_id: codex_implementation_discipline_diet
feature:
  id: codex_implementation_discipline_diet
  name: Codex implementation discipline doctrine diet
  kind: doctrine
workspace:
  fixture_root: ../..
invariants:
  - id: codex_doctrine_keeps_compressed_preedit_and_ship_rules
    description: >-
      Codex doctrine keeps the compressed pre-edit and complete scoped
      implementation rules active.
  - id: codex_doctrine_retires_performance_hotpath_rules
    description: >-
      Codex active doctrine omits the retired performance escalation and
      hot-path diagnosis details.
forbidden_failure_modes:
  - Codex generated doctrine omits the compressed implementation rules.
  - Codex generated doctrine still includes the retired >60s, >5 min, or >20 min thresholds.
  - Codex generated doctrine still includes the retired Rust versus C++ decision rule.
  - Claude doctrine changes for a Codex-only doctrine requirement.
evidence_sources:
  - scripts/validate_codex.py stdout
  - targeted unittest output for compressed implementation discipline
lanes:
  - id: codex_implementation_discipline_diet_validation
    type: happy_path_closure
    description: >-
      Validate generated Codex doctrine and run the targeted implementation
      discipline doctrine-diet regression test.
    command:
      argv:
        - bash
        - "-lc"
        - "python scripts/validate_codex.py && python -m unittest tests.test_pipeline.PipelineTests.test_codex_implementation_discipline_is_compressed_and_retired_perf_rules_are_dormant && echo CODEX_IMPL_DISCIPLINE_DIET: ok"
      cwd: .
      timeout_seconds: 60
    expected:
      returncode: 0
      stdout_contains:
        - "codex validation passed"
        - "CODEX_IMPL_DISCIPLINE_DIET: ok"
    classifications_on_failure:
      - missing compressed implementation doctrine
      - retired performance doctrine still active
      - stale generated Codex doctrine
      - provider separation regression
